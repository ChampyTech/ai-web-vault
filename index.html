<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Web Vault — Collezione di siti fatti con l'AI</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-hover: #1f2430;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #6366f1;
      --border: #272c3a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
    }

    header p {
      color: var(--muted);
    }

    .controls {
      margin-bottom: 1.5rem;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      background: var(--surface-hover);
      border-color: #384054;
    }

    .card h2 {
      font-size: 1.05rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 0.75rem;
      border-top: 1px solid var(--border);
      padding-top: 0.65rem;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .meta strong {
      color: var(--text);
      font-weight: 500;
    }

    .card a {
      color: #fff;
      background: var(--accent);
      text-decoration: none;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .card a:hover {
      opacity: 0.92;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2.5rem 1rem;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>AI Web Vault</h1>
      <p>Archivio personale di esperimenti, landing page e micro-siti creati con l'intelligenza artificiale.</p>
    </header>

    <div class="controls">
      <input type="search" id="search" class="search-input"
        placeholder="Cerca per titolo, modello AI, linguaggi o file..." aria-label="Cerca siti" />
    </div>

    <main class="grid" id="grid"></main>
    <p class="empty" id="empty">Nessun sito trovato.</p>
  </div>

  <script>
    const FOLDER = "websites/";

    const SITES = [
      {
        title: "Esploratore interattivo della parabola",
        ai: "Gemini 4 Hydrogen",
        languages: "HTML, CSS, JavaScript",
        file: "esploratore_interattivo_della_parabola.html"
      },
      {
        title: "Simulatore 3D della circonferenza e della sfera trigonometrica",
        ai: "Gemini 4 Hydrogen",
        languages: "HTML, CSS, JavaScript",
        file: "simulatore_3d_della_circonferenza_e_della_sfera_trigonometrica.html"
      },
      {
        title: "Laboratorio interattivo delle sezioni coniche",
        ai: "Gemini 4 Hydrogen",
        languages: "HTML, CSS, JavaScript",
        file: "laboratorio_interattivo_delle_sezioni_coniche.html"
      },
      {
        title: "Numeri complessi interattivi",
        ai: "ChatGPT",
        languages: "HTML, CSS, JavaScript",
        file: "numeri_complessi_interattivi.html"
      },
      {
        title: "Calcolatrice codici colore resistori",
        ai: "ChatGPT",
        languages: "HTML, CSS, JavaScript",
        file: "calcolatrice_codici_colore_resistori.html"
      },
      {
        title: "Simulatore interattivo 3D del Sistema Solare",
        ai: "Gemini",
        languages: "HTML, CSS, JavaScript",
        file: "simulatore_interattivo_3d_del_sistema_solare.html"
      },
      {
        title: "Villa moderna 3D tour architettonico interattivo",
        ai: "Gemini",
        languages: "HTML, CSS, JavaScript",
        file: "villa_moderna_3d_tour_architettonico_interattivo.html"
      },
      {
        title: "NoiCompriamoAuto.it",
        ai: "Gemini",
        languages: "HTML, CSS, JavaScript",
        file: "noicompriamoauto.it.html"
      },
      {
        title: "Convertitore laboratorio testo avanzato",
        ai: "Gemini",
        languages: "HTML, CSS, JavaScript",
        file: "convertitore_laboratorio_testo_avanzato.html"
      },
      {
        title: "Calcolatrice grafica laboratorio analitico interattivo",
        ai: "Gemini",
        languages: "HTML, CSS, JavaScript",
        file: "calcolatrice_grafica_laboratorio_analitico_interattivo.html"
      },
      {
        title: "Numeri complessi calcolo trigonometria",
        ai: "Gemini",
        languages: "HTML, CSS, JavaScript",
        file: "numeri_complessi_calcolo_trigonometria.html"
      },
    ];

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const searchInput = document.getElementById("search");

    function render() {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = SITES.filter((site) =>
        site.title.toLowerCase().includes(query) ||
        site.ai.toLowerCase().includes(query) ||
        site.languages.toLowerCase().includes(query) ||
        site.file.toLowerCase().includes(query)
      );

      grid.innerHTML = filtered
        .map(
          (site) => `
          <article class="card">
            <h2>${site.title}</h2>
            <div class="card-footer">
              <div class="meta">
                <span>Modello AI: <strong>${site.ai}</strong></span>
                <span>Linguaggi: <strong>${site.languages}</strong></span>
              </div>
              <a href="${FOLDER}${encodeURIComponent(site.file)}" target="_blank" rel="noopener noreferrer">Apri</a>
            </div>
          </article>
        `
        )
        .join("");

      empty.style.display = filtered.length === 0 ? "block" : "none";
    }

    searchInput.addEventListener("input", render);
    render();
  </script>
</body>

</html>
